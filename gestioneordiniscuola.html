<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ordine Divise Scolastiche</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f7f9fa;
        color: #333;
        padding: 20px;
        margin: 0;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
        background: #ffffff;
        padding: 25px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }
      h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 14px;
      }
      input[type="text"], select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 15px;
      }
      input[readonly] {
        background-color: #e9ecef;
        cursor: not-allowed;
      }
      .section-divisa {
        border: 2px solid #3498db;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        background-color: #f0f8ff;
      }
      .section-legend {
        color: #2980b9;
        font-weight: bold;
        padding: 0 10px;
        font-size: 15px;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: 10px;
      }
      button:disabled {
        background-color: #95a5a6;
        cursor: not-allowed;
      }
      #status-db {
        font-size: 12px;
        color: #e67e22;
        margin-bottom: 15px;
        text-align: center;
        font-weight: bold;
      }
      #message {
        margin-top: 20px;
        text-align: center;
        font-weight: bold;
        padding: 10px;
        border-radius: 5px;
        display: none;
      }
      .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
      .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Ordine Divise Scolastiche[cite: 1]</h2>
      
      <div id="status-db">Sincronizzazione catalogo prodotti in corso...</div>

      <form id="orderForm">
        
        <div class="form-group">
          <label for="nome">Nome Alunno:</label>
          <input type="text" id="nome" name="nome" placeholder="Inserisci il nome" required>
        </div>
        
        <div class="form-group">
          <label for="cognome">Cognome Alunno:</label>
          <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome" required>
        </div>
        
        <div class="form-group">
          <label for="comune">Comune (Plesso):</label>
          <select id="comune" name="comune" onchange="updateGrado()" required>
            <option value="">-- Seleziona Comune/Plesso --</option>
            <option value="Antonimina">Antonimina</option>
            <option value="Trarie">Trarie</option>
            <option value="Azzuria/Merici">Azzuria/Merici</option>
            <option value="Gerace">Gerace</option>
            <option value="Canolo">Canolo</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="grado">Grado Scolastico:</label>
          <select id="grado" name="grado" onchange="updateClassi()" required>
            <option value="">-- Prima seleziona un Comune --</option>
          </select>
        </div>

        <fieldset class="section-divisa">
          <legend class="section-legend">Configurazione Divisa</legend>
          
          <div class="form-group">
            <label for="classe">Classe di Appartenenza:</label>
            <select id="classe" name="classe" onchange="filtraOpzioniDivisa()" required disabled>
              <option value="">-- Prima seleziona il Grado --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="colore">Colore/Tipo della Tuta:</label>
            <input type="text" id="colore" name="colore" placeholder="Si compila automaticamente" readonly required>
          </div>

          <div class="form-group">
            <label for="misura">Misura della Tuta:</label>
            <select id="misura" name="misura" required disabled>
              <option value="">-- Prima seleziona la Classe --</option>
            </select>
          </div>
        </fieldset>

        <button type="button" id="submitBtn" onclick="submitForm()" disabled>Attendi sincronizzazione...</button>
      </form>
      <div id="message"></div>
    </div>

    <script>
      const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6ZYZjFh_B-zeHVhdK5UnRsPY2iF0a1gD7tK1msKbilWivoBimB8sTaxgDm339AScB/exec';
      
      let dbProdotti = [];

      const scuoleData = {
        "Antonimina": ["Scuola secondaria di primo grado"],
        "Trarie": ["Scuola dell'infanzia", "Scuola primaria"],
        "Azzuria/Merici": ["Scuola dell'infanzia", "Scuola primaria"],
        "Gerace": ["Scuola dell'infanzia", "Scuola primaria", "Scuola secondaria di primo grado"],
        "Canolo": ["Scuola primaria"]
      };

      // Estrattore universale per ignorare spazi e maiuscole/minuscole nelle intestazioni
      function getColValue(item, colName) {
        const key = Object.keys(item).find(k => k.trim().toUpperCase() === colName.trim().toUpperCase());
        return key ? item[key] : null;
      }

      window.onload = function() {
        fetch(SCRIPT_URL + '?action=getProdotti')
          .then(res => res.json())
          .then(data => {
            if(data.error) {
              document.getElementById("status-db").innerText = "Errore: " + data.error;
              return;
            }
            dbProdotti = data;
            
            document.getElementById("status-db").style.display = "none";
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("submitBtn").innerText = "Registra Ordine";
          })
          .catch(err => {
            document.getElementById("status-db").innerText = "Impossibile scaricare le divise. Ricarica la pagina.";
            document.getElementById("status-db").style.color = "red";
          });
      };

      function updateGrado() {
        const comune = document.getElementById("comune").value;
        const grado = document.getElementById("grado");
        
        grado.innerHTML = '<option value="">-- Seleziona Grado Scolastico --</option>';
        document.getElementById("classe").innerHTML = '<option value="">-- Prima seleziona il Grado --</option>';
        document.getElementById("classe").disabled = true;
        document.getElementById("colore").value = "";
        document.getElementById("misura").innerHTML = '<option value="">-- Prima seleziona la Classe --</option>';
        document.getElementById("misura").disabled = true;

        if (comune && scuoleData[comune]) {
          scuoleData[comune].forEach(g => {
            const opt = document.createElement("option");
            opt.value = g; opt.text = g;
            grado.appendChild(opt);
          });
        }
      }

      function updateClassi() {
        // Legge il grado selezionato in formato minuscolo per la comparazione
        const gradoSelezionato = document.getElementById("grado").value.trim().toLowerCase();
        const classeSelect = document.getElementById("classe");
        
        document.getElementById("colore").value = "";
        document.getElementById("misura").innerHTML = '<option value="">-- Prima seleziona la Classe --</option>';
        document.getElementById("misura").disabled = true;

        classeSelect.innerHTML = '<option value="">-- Seleziona Classe --</option>';

        if (!gradoSelezionato) {
          classeSelect.disabled = true;
          return;
        }

        // Filtra usando la colonna "GRADO" (ignora maiuscole e spazi)
        const classiFiltrate = dbProdotti.filter(item => {
           const val = getColValue(item, "GRADO");
           return val && val.toString().trim().toLowerCase() === gradoSelezionato;
        });

        // Mappa i risultati usando la colonna "CLASSE"
        const classiUniche = [...new Set(classiFiltrate.map(item => getColValue(item, "CLASSE")))].filter(Boolean).sort();
        
        if (classiUniche.length > 0) {
          classiUniche.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c; opt.text = c;
            classeSelect.appendChild(opt);
          });
          classeSelect.disabled = false;
        } else {
          classeSelect.innerHTML = '<option value="">Nessuna classe trovata nel DB</option>';
          classeSelect.disabled = true;
        }
      }

      function filtraOpzioniDivisa() {
        const classe = document.getElementById("classe").value.trim().toLowerCase();
        const grado = document.getElementById("grado").value.trim().toLowerCase();
        const coloreInput = document.getElementById("colore");
        const misuraSelect = document.getElementById("misura");

        misuraSelect.innerHTML = '<option value="">-- Seleziona Misura --</option>';
        
        if (!classe || !grado) {
          coloreInput.value = "";
          misuraSelect.disabled = true;
          return;
        }

        // Trova la riga specifica (matching "CLASSE" e "GRADO" insensibile)
        const righeClasse = dbProdotti.filter(item => {
          const c = getColValue(item, "CLASSE");
          const g = getColValue(item, "GRADO");
          return c && g && c.toString().trim().toLowerCase() === classe && g.toString().trim().toLowerCase() === grado;
        });
        
        if (righeClasse.length > 0) {
          coloreInput.value = getColValue(righeClasse[0], "TUTA") || "";
          
          let tutteLeMisure = [];
          righeClasse.forEach(item => {
            const misure = getColValue(item, "MIS TUTE");
            if (misure) {
              const separate = misure.toString().split('-');
              separate.forEach(m => {
                if (m.trim()) tutteLeMisure.push(m.trim());
              });
            }
          });
          
          let misureUniche = [...new Set(tutteLeMisure)];
          
          // Mappa estesa per gestire l'ordine
          const priority = { 'XXXS': 1, 'XXS': 2, 'XS': 3, 'S': 4, 'M': 5, 'L': 6, 'XL': 7, 'XXL': 8 };
          
          misureUniche.sort((a, b) => {
             const pA = priority[a.toUpperCase()] || 99;
             const pB = priority[b.toUpperCase()] || 99;
             return pA - pB;
          });

          misureUniche.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m; opt.text = m;
            misuraSelect.appendChild(opt);
          });
          
          misuraSelect.disabled = false;
        } else {
          coloreInput.value = "Nessuna divisa trovata";
          misuraSelect.disabled = true;
        }
      }

      function submitForm() {
        const form = document.getElementById("orderForm");
        const msgDiv = document.getElementById("message");
        const btn = document.getElementById("submitBtn");

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const data = {
          nome: document.getElementById("nome").value,
          cognome: document.getElementById("cognome").value,
          comune: document.getElementById("comune").value,
          grado: document.getElementById("grado").value,
          classe: document.getElementById("classe").value,
          misura: document.getElementById("misura").value,
          colore: document.getElementById("colore").value
        };

        btn.disabled = true;
        btn.innerText = "Registrazione in corso...";
        msgDiv.style.display = "none";

        fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(resData => {
          msgDiv.style.display = "block";
          if (resData.status === "success") {
            msgDiv.innerText = resData.message;
            msgDiv.className = "success";
            form.reset();
            updateGrado();
          } else {
            msgDiv.innerText = "Errore: " + resData.message;
            msgDiv.className = "error";
          }
          btn.disabled = false;
          btn.innerText = "Registra Ordine";
        })
        .catch(err => {
          msgDiv.style.display = "block";
          msgDiv.innerText = "Si è verificato un errore di connessione col server.";
          msgDiv.className = "error";
          btn.disabled = false;
          btn.innerText = "Registra Ordine";
        });
      }
    </script>
  </body>
</html>
