<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ordine Divise Scolastiche - Gerace</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #ff6b6b;
        --secondary: #4ecdc4;
        --dark: #2d3436;
        --light: #f7f9fc;
        --white: #ffffff;
      }
      body {
        font-family: 'Nunito', sans-serif;
        background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        color: var(--dark);
        padding: 20px 10px;
        margin: 0;
      }
      .container {
        max-width: 650px;
        margin: 0 auto;
        background: var(--white);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        overflow: hidden;
      }
      /* Immagine di copertina (Gerace) */
      .header-image {
        width: 100%;
        height: 220px;
        background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Gerace_panorama.jpg/800px-Gerace_panorama.jpg') no-repeat center center;
        background-size: cover;
        position: relative;
      }
      .header-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        padding: 30px 20px 15px;
        color: white;
        text-align: center;
      }
      .header-overlay h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .form-content {
        padding: 30px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 14px;
        color: #555;
      }
      input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e1e5ee;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 15px;
        font-family: 'Nunito', sans-serif;
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      input:focus, select:focus {
        border-color: var(--secondary);
        box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        outline: none;
      }
      input[readonly] {
        background-color: #f8f9fa;
        color: #7f8c8d;
        cursor: not-allowed;
      }
      fieldset {
        border: none;
        background: var(--light);
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 25px;
        position: relative;
      }
      legend {
        background: var(--primary);
        color: white;
        padding: 6px 16px;
        border-radius: 20px;
        font-weight: 800;
        font-size: 14px;
        box-shadow: 0 4px 6px rgba(255, 107, 107, 0.2);
      }
      /* Colori alternativi per le sezioni */
      .section-genitore legend { background: #ff9f43; box-shadow: 0 4px 6px rgba(255, 159, 67, 0.2); }
      .section-alunno legend { background: var(--secondary); box-shadow: 0 4px 6px rgba(78, 205, 196, 0.2); }
      .section-divisa legend { background: #5f27cd; box-shadow: 0 4px 6px rgba(95, 39, 205, 0.2); }
      
      .product-box {
        background: var(--white);
        border: 1px solid #eee;
        padding: 18px;
        border-radius: 10px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      }
      .product-title {
        font-size: 16px;
        font-weight: 800;
        color: #5f27cd;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        width: 100%;
        padding: 15px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 800;
        font-family: 'Nunito', sans-serif;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s;
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
      }
      button:hover:not(:disabled) {
        background-color: #ff5252;
        transform: translateY(-2px);
      }
      button:disabled {
        background-color: #bdc3c7;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }
      #status-db {
        background: #fef9e7;
        color: #d35400;
        padding: 10px;
        text-align: center;
        font-weight: bold;
        font-size: 13px;
        border-bottom: 1px solid #f1c40f;
      }
      #message {
        margin-top: 20px;
        text-align: center;
        font-weight: 800;
        padding: 15px;
        border-radius: 8px;
        display: none;
      }
      .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
      .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
  </head>
  <body>
    <div class="container">
      
      <div class="header-image">
        <div class="header-overlay">
          <h2>Ordini Divise Scolastiche</h2>
        </div>
      </div>

      <div id="status-db">⏳ Sincronizzazione catalogo in corso...</div>

      <div class="form-content">
        <form id="orderForm">
          
          <!-- DATI GENITORE -->
          <fieldset class="section-genitore">
            <legend>👤 Dati del Genitore</legend>
            <div class="form-group">
              <label for="nomeGenitore">Nome e Cognome:</label>
              <input type="text" id="nomeGenitore" name="nomeGenitore" placeholder="Inserisci nome e cognome" onblur="formattaTesto(this)" required>
            </div>
            <div class="form-group">
              <label for="emailGenitore">Email:</label>
              <input type="email" id="emailGenitore" name="emailGenitore" placeholder="es. mario.rossi@email.com" required>
            </div>
            <div class="form-group">
              <label for="telefonoGenitore">Telefono (Cellulare):</label>
              <input type="tel" id="telefonoGenitore" name="telefonoGenitore" placeholder="es. 3331234567" required>
            </div>
          </fieldset>

          <!-- DATI ALUNNO -->
          <fieldset class="section-alunno">
            <legend>🎓 Dati dell'Alunno</legend>
            <div class="form-group">
              <label for="nome">Nome Alunno:</label>
              <input type="text" id="nome" name="nome" placeholder="Inserisci il nome" onblur="formattaTesto(this)" required>
            </div>
            <div class="form-group">
              <label for="cognome">Cognome Alunno:</label>
              <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome" onblur="formattaTesto(this)" required>
            </div>
            <div class="form-group">
              <label for="comune">Comune (Plesso):</label>
              <select id="comune" name="comune" onchange="updateGrado()" required>
                <option value="">-- Seleziona Comune/Plesso --</option>
                <option value="Antonimina">Antonimina</option>
                <option value="Trearie">Trearie</option>
                <option value="Azzuria/Merici">Azzuria/Merici</option>
                <option value="Gerace">Gerace</option>
                <option value="Canolo">Canolo</option>
              </select>
            </div>
            <div class="form-group">
              <label for="grado">Grado Scolastico:</label>
              <select id="grado" name="grado" onchange="updateClassi()" required>
                <option value="">-- Prima seleziona un Comune --</option>
              </select>
            </div>
          </fieldset>

          <!-- CONFIGURAZIONE DIVISA -->
          <fieldset class="section-divisa">
            <legend>👕 Configurazione Divisa</legend>
            
            <div class="form-group">
              <label for="classe">Classe di Appartenenza:</label>
              <select id="classe" name="classe" onchange="filtraOpzioniDivisa()" required disabled>
                <option value="">-- Prima seleziona il Grado --</option>
              </select>
            </div>

            <!-- PRODOTTO: TUTA -->
            <div class="product-box">
              <div class="product-title">📦 Ordina Tuta</div>
              <div class="form-group">
                <label for="colore">Colore Tuta:</label>
                <input type="text" id="colore" name="colore" placeholder="Si compila automaticamente" readonly>
              </div>
              <div class="form-group">
                <label for="misura">Misura Tuta:</label>
                <select id="misura" name="misura" disabled>
                  <option value="">-- Prima seleziona la Classe --</option>
                </select>
              </div>
              <div class="form-group">
                <label for="persTuta">Personalizzazione Tuta:</label>
                <select id="persTuta" name="persTuta" disabled>
                  <option value="Nessuna">Nessuna personalizzazione</option>
                  <option value="Solo logo scuola">Solo logo della scuola</option>
                  <option value="Logo scuola e nome">Logo scuola e nome del bambino</option>
                </select>
              </div>
              <div class="form-group">
                <label for="quantitaTuta">Quantità Tuta:</label>
                <input type="number" id="quantitaTuta" name="quantitaTuta" min="0" value="0">
              </div>
            </div>

            <!-- PRODOTTO: T-SHIRT -->
            <div class="product-box">
              <div class="product-title">👕 Ordina T-Shirt</div>
              <div class="form-group">
                <label for="tshirtColore">Colore T-Shirt:</label>
                <input type="text" id="tshirtColore" name="tshirtColore" placeholder="Si compila automaticamente" readonly>
              </div>
              <div class="form-group">
                <label for="tshirtMisura">Misura T-Shirt:</label>
                <select id="tshirtMisura" name="tshirtMisura" disabled>
                  <option value="">-- Prima seleziona la Classe --</option>
                </select>
              </div>
              <div class="form-group">
                <label for="persTshirt">Personalizzazione T-Shirt:</label>
                <select id="persTshirt" name="persTshirt" disabled>
                  <option value="Nessuna">Nessuna personalizzazione</option>
                  <option value="Solo logo scuola">Solo logo della scuola</option>
                  <option value="Logo scuola e nome">Logo scuola e nome del bambino</option>
                </select>
              </div>
              <div class="form-group">
                <label for="quantitaTshirt">Quantità T-Shirt:</label>
                <input type="number" id="quantitaTshirt" name="quantitaTshirt" min="0" value="0">
              </div>
            </div>

          </fieldset>

          <button type="button" id="submitBtn" onclick="submitForm()" disabled>Attendi sincronizzazione...</button>
        </form>
        <div id="message"></div>
      </div>
    </div>

    <script>
      const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6ZYZjFh_B-zeHVhdK5UnRsPY2iF0a1gD7tK1msKbilWivoBimB8sTaxgDm339AScB/exec';
      let dbProdotti = [];

      const scuoleData = {
        "Antonimina": ["Scuola secondaria di primo grado"],
        "Trearie": ["Scuola dell'infanzia", "Scuola primaria"],
        "Azzuria/Merici": ["Scuola dell'infanzia", "Scuola primaria"],
        "Gerace": ["Scuola dell'infanzia", "Scuola primaria", "Scuola secondaria di primo grado"],
        "Canolo": ["Scuola primaria"]
      };

      const priorityMap = {
        'XXXS': 1, 'XXS': 2, 'XS': 3, 'S': 4, 'M': 5, 'L': 6, 'XL': 7, 'XXL': 8,
        '2/3': 9, '4/5': 10, '6/7': 11, '8/9': 12, '10/11': 13, '12/13': 14
      };

      // Funzione per maiuscola iniziale e resto minuscolo
      function formattaTesto(inputElement) {
        let testo = inputElement.value;
        if (!testo) return;
        testo = testo.toLowerCase().replace(/(?:^|\s)\S/g, function(lettera) {
          return lettera.toUpperCase();
        });
        inputElement.value = testo;
      }

      function getColValue(item, colName) {
        const key = Object.keys(item).find(k => k.trim().toUpperCase() === colName.trim().toUpperCase());
        return key ? item[key] : null;
      }

      window.onload = function() {
        fetch(SCRIPT_URL + '?action=getProdotti')
          .then(res => res.json())
          .then(data => {
            if(data.error) {
              document.getElementById("status-db").innerText = "❌ Errore: " + data.error;
              return;
            }
            dbProdotti = data;
            document.getElementById("status-db").style.display = "none";
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("submitBtn").innerText = "Invia Ordine ✓";
          })
          .catch(err => {
            document.getElementById("status-db").innerText = "❌ Impossibile scaricare le divise. Ricarica la pagina.";
            document.getElementById("status-db").style.color = "red";
          });
      };

      function updateGrado() {
        const comune = document.getElementById("comune").value;
        const grado = document.getElementById("grado");
        
        grado.innerHTML = '<option value="">-- Seleziona Grado Scolastico --</option>';
        document.getElementById("classe").innerHTML = '<option value="">-- Prima seleziona il Grado --</option>';
        document.getElementById("classe").disabled = true;
        resetProdotti();

        if (comune && scuoleData[comune]) {
          scuoleData[comune].forEach(g => {
            const opt = document.createElement("option");
            opt.value = g; opt.text = g;
            grado.appendChild(opt);
          });
        }
      }

      function updateClassi() {
        const gradoSelezionato = document.getElementById("grado").value.trim().toLowerCase();
        const classeSelect = document.getElementById("classe");
        
        resetProdotti();
        classeSelect.innerHTML = '<option value="">-- Seleziona Classe --</option>';

        if (!gradoSelezionato) {
          classeSelect.disabled = true;
          return;
        }

        const classiFiltrate = dbProdotti.filter(item => {
           const val = getColValue(item, "GRADO");
           return val && val.toString().trim().toLowerCase() === gradoSelezionato;
        });

        const classiUniche = [...new Set(classiFiltrate.map(item => getColValue(item, "CLASSE")))].filter(Boolean).sort();
        
        if (classiUniche.length > 0) {
          classiUniche.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c; opt.text = c;
            classeSelect.appendChild(opt);
          });
          classeSelect.disabled = false;
        } else {
          classeSelect.innerHTML = '<option value="">Nessuna classe trovata nel DB</option>';
          classeSelect.disabled = true;
        }
      }

      function resetProdotti() {
        document.getElementById("colore").value = "";
        document.getElementById("misura").innerHTML = '<option value="">-- Prima seleziona la Classe --</option>';
        document.getElementById("misura").disabled = true;
        document.getElementById("persTuta").value = "Nessuna";
        document.getElementById("persTuta").disabled = true;
        document.getElementById("quantitaTuta").value = "0";

        document.getElementById("tshirtColore").value = "";
        document.getElementById("tshirtMisura").innerHTML = '<option value="">-- Prima seleziona la Classe --</option>';
        document.getElementById("tshirtMisura").disabled = true;
        document.getElementById("persTshirt").value = "Nessuna";
        document.getElementById("persTshirt").disabled = true;
        document.getElementById("quantitaTshirt").value = "0";
      }

      function parseMisure(misureString, selectElement) {
        if (!misureString) return;
        const separate = misureString.toString().split('-');
        let uniche = [...new Set(separate.map(m => m.trim()).filter(Boolean))];
        
        uniche.sort((a, b) => {
           const pA = priorityMap[a.toUpperCase()] || 99;
           const pB = priorityMap[b.toUpperCase()] || 99;
           return pA - pB;
        });

        uniche.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m; opt.text = m;
          selectElement.appendChild(opt);
        });
      }

      function filtraOpzioniDivisa() {
        const classe = document.getElementById("classe").value.trim().toLowerCase();
        const grado = document.getElementById("grado").value.trim().toLowerCase();
        
        resetProdotti();

        if (!classe || !grado) return;

        const righeClasse = dbProdotti.filter(item => {
          const c = getColValue(item, "CLASSE");
          const g = getColValue(item, "GRADO");
          return c && g && c.toString().trim().toLowerCase() === classe && g.toString().trim().toLowerCase() === grado;
        });
        
        if (righeClasse.length > 0) {
          const riga = righeClasse[0];

          const tutaColore = getColValue(riga, "TUTA") || "";
          if (tutaColore) {
            document.getElementById("colore").value = tutaColore;
            const msTuta = document.getElementById("misura");
            msTuta.innerHTML = '<option value="">-- Seleziona Misura --</option>';
            parseMisure(getColValue(riga, "MIS TUTE"), msTuta);
            msTuta.disabled = false;
            document.getElementById("persTuta").disabled = false;
          }

          const tshirtColore = getColValue(riga, "T-SHIRT") || "";
          if (tshirtColore) {
            document.getElementById("tshirtColore").value = tshirtColore;
            const msTshirt = document.getElementById("tshirtMisura");
            msTshirt.innerHTML = '<option value="">-- Seleziona Misura --</option>';
            parseMisure(getColValue(riga, "MISURE T-SHIRT"), msTshirt);
            msTshirt.disabled = false;
            document.getElementById("persTshirt").disabled = false;
          }
        }
      }

      function submitForm() {
        const form = document.getElementById("orderForm");
        const msgDiv = document.getElementById("message");
        const btn = document.getElementById("submitBtn");

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const qTuta = parseInt(document.getElementById("quantitaTuta").value) || 0;
        const qTshirt = parseInt(document.getElementById("quantitaTshirt").value) || 0;

        if (qTuta === 0 && qTshirt === 0) {
          alert("Devi ordinare almeno una Tuta o una T-Shirt (Quantità > 0).");
          return;
        }

        if (qTuta > 0 && document.getElementById("misura").value === "") {
          alert("Hai inserito una quantità per la Tuta ma non hai selezionato la Misura.");
          return;
        }

        if (qTshirt > 0 && document.getElementById("tshirtMisura").value === "") {
          alert("Hai inserito una quantità per la T-Shirt ma non hai selezionato la Misura.");
          return;
        }

        const data = {
          nomeGenitore: document.getElementById("nomeGenitore").value,
          emailGenitore: document.getElementById("emailGenitore").value,
          telefonoGenitore: document.getElementById("telefonoGenitore").value,
          nome: document.getElementById("nome").value,
          cognome: document.getElementById("cognome").value,
          comune: document.getElementById("comune").value,
          grado: document.getElementById("grado").value,
          classe: document.getElementById("classe").value,
          
          colore: qTuta > 0 ? document.getElementById("colore").value : "",
          misura: qTuta > 0 ? document.getElementById("misura").value : "",
          quantitaTuta: qTuta,
          persTuta: qTuta > 0 ? document.getElementById("persTuta").value : "",

          tshirtColore: qTshirt > 0 ? document.getElementById("tshirtColore").value : "",
          tshirtMisura: qTshirt > 0 ? document.getElementById("tshirtMisura").value : "",
          quantitaTshirt: qTshirt,
          persTshirt: qTshirt > 0 ? document.getElementById("persTshirt").value : ""
        };

        btn.disabled = true;
        btn.innerText = "Registrazione in corso...";
        msgDiv.style.display = "none";

        fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(resData => {
          msgDiv.style.display = "block";
          if (resData.status === "success") {
            msgDiv.innerText = "Ordine Inviato con Successo! 🎉";
            msgDiv.className = "success";
            form.reset();
            updateGrado();
          } else {
            msgDiv.innerText = "Errore: " + resData.message;
            msgDiv.className = "error";
          }
          btn.disabled = false;
          btn.innerText = "Invia Ordine ✓";
        })
        .catch(err => {
          msgDiv.style.display = "block";
          msgDiv.innerText = "Si è verificato un errore di connessione col server.";
          msgDiv.className = "error";
          btn.disabled = false;
          btn.innerText = "Invia Ordine ✓";
        });
      }
    </script>
  </body>
</html>
